name: ✨ 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 想要解决的问题
      description: 描述使用场景与痛点
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 建议方案
      description: 期望的交互/行为，参考产品亦可
  - type: textarea
    id: alt
    attributes:
      label: 替代方案（可选）
