name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: 安装依赖
        working-directory: server
        run: npm ci
      - name: 后端语法检查
        working-directory: server
        run: |
          node --check server.js
          node --check app.js
          for f in src/*.js src/routes/*.js src/providers/*.js src/lib/*.js src/schemas/*.js src/services/*.js scripts/*.js; do
            node --check "$f"
          done
      - name: 后端测试（Vitest + supertest）
        working-directory: server
        run: npx vitest run

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装依赖
        working-directory: app
        run: npm ci
      - name: 前端构建（Vite 构建即语法门禁）
        working-directory: app
        run: npm run build
      - name: 前端服务层单测
        working-directory: app
        run: npx vitest run
