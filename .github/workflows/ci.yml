name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: 安装依赖
        working-directory: server
        run: npm ci
      - name: 后端语法检查
        working-directory: server
        run: |
          node --check server.js
          for f in src/*.js src/routes/*.js src/providers/*.js scripts/*.js; do
            node --check "$f"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 前端语法检查
        run: |
          for f in app/js/*.js; do
            node --check "$f"
          done
