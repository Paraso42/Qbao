name: Release 桌面版构建

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装前端依赖
        working-directory: app
        run: npm ci
      - name: 构建前端（Vite singlefile → app/dist）
        working-directory: app
        run: npm run build
      - name: 安装桌面端依赖
        working-directory: desktop
        run: npm ci
      - name: 全量语法检查
        shell: bash
        run: |
          node --check desktop/main.js
          node --check desktop/preload.js
          node --check desktop/updater.js
          for f in server/src/*.js server/src/routes/*.js server/src/providers/*.js server/src/lib/*.js server/src/schemas/*.js server/src/services/*.js server/scripts/*.js; do node --check "$f"; done
      - name: 后端测试（T20: forks 参数固定）
        working-directory: server
        run: npx vitest run --pool=forks --poolOptions.forks.maxForks=2
      - name: 构建 NSIS 安装包
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never
      - name: 发布 GitHub Release（gh CLI）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd desktop/release
          EXE=$(ls Qbao*Setup*.exe | head -1)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Qbao $GITHUB_REF_NAME" \
            --generate-notes \
            "$EXE" latest.yml *.blockmap