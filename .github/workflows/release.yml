name: Release 桌面版构建

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-desktop:
    # v3.35 通道纪律：测试版 tag（含 - 后缀，如 v3.35.0-beta.1）不触发稳定版 Release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 断言 tag 与三端版本一致（P2.5）
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in app server desktop; do
            V=$(node -p "require('./$f/package.json').version")
            echo "$f package.json version = $V (tag = $TAG)"
            if [ "$V" != "$TAG" ]; then
              echo "::error::$f package.json 版本 $V 与 tag $TAG 不一致，终止发布"
              exit 1
            fi
          done
      - name: 安装前端依赖
        working-directory: app
        run: npm ci
      - name: 构建前端（Vite singlefile → app/dist）
        working-directory: app
        run: npm run build
      - name: 安装桌面端依赖
        working-directory: desktop
        run: npm ci
      - name: 全量语法检查
        shell: bash
        run: |
          node --check desktop/main.js
          node --check desktop/preload.js
          node --check desktop/updater.js
          node --check desktop/updater-util.js
          for f in server/src/*.js server/src/routes/*.js server/src/providers/*.js server/src/lib/*.js server/src/schemas/*.js server/src/services/*.js server/scripts/*.js; do node --check "$f"; done
      - name: 构建 NSIS 安装包
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never
      - name: 产物存在性检查（P2.5）
        shell: bash
        run: |
          cd desktop/release
          ls -la
          test -f Qbao*Setup*.exe && echo "exe OK"
          test -f *.blockmap && echo "blockmap OK"
          test -s latest.yml && echo "latest.yml OK"
          test -f Qbao*Setup*.exe && test -s latest.yml && test -f *.blockmap || { echo "::error::发布产物缺失"; exit 1; }
      - name: 发布 GitHub Release（gh CLI）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd desktop/release
          EXE=$(ls Qbao*Setup*.exe | head -1)
          BLOCKMAP=$(ls *.blockmap | head -1)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Qbao $GITHUB_REF_NAME" \
            --generate-notes \
            "$EXE" latest.yml "$BLOCKMAP"